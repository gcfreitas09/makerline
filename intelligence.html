<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Makerline Intelligence</title>
    <script>
      if (window.top === window.self && !new URLSearchParams(window.location.search).has('embed')) {
        window.location.replace('tracker?view=application');
      }
    </script>
    <link rel="icon" type="image/png" href="assets/img/logo.png" />
    <link rel="apple-touch-icon" href="assets/img/logo.png" />
    <link rel="stylesheet" href="assets/css/app2.css?v=20260217c" />
    <link rel="stylesheet" href="assets/css/intelligence.css?v=20260713a" />
  </head>
  <body class="ml-body">
    <main class="ml-app-shell">
      <div class="ml-page">
        <div id="intelligence-message" class="ml-inline-message"></div>
        <div id="intelligence-app"></div>
      </div>
    </main>

    <aside id="intelligence-side-panel" class="ml-side-panel" aria-hidden="true">
      <div class="ml-side-panel__scrim" data-action="close-panel"></div>
      <div class="ml-side-panel__content">
        <div class="ml-side-panel__topbar">
          <p>Detalhes do usuário</p>
          <button class="ml-btn ml-btn--ghost" type="button" data-action="close-panel">Fechar</button>
        </div>
        <div id="intelligence-side-panel-body"></div>
      </div>
    </aside>

    <div id="intelligence-delete-modal" class="ml-modal" aria-hidden="true">
      <div class="ml-modal__scrim" data-action="close-delete"></div>
      <div class="ml-modal__panel">
        <div class="ml-modal__head">
          <div>
            <p class="ml-kicker">Ação crítica</p>
            <h3 id="intelligence-delete-title">Excluir usuário</h3>
            <p id="intelligence-delete-text" class="ml-modal__copy">Essa ação é permanente.</p>
          </div>
          <button class="ml-btn ml-btn--ghost" type="button" data-action="close-delete">Fechar</button>
        </div>
        <div class="ml-modal__actions">
          <button class="ml-btn ml-btn--danger" type="button" data-action="confirm-delete">Excluir usuário</button>
          <div id="intelligence-delete-message" class="ml-inline-message"></div>
        </div>
      </div>
    </div>

    <div id="intelligence-reset-password-modal" class="ml-modal" aria-hidden="true">
      <div class="ml-modal__scrim" data-action="close-reset-password"></div>
      <div class="ml-modal__panel">
        <div class="ml-modal__head">
          <div>
            <p class="ml-kicker">Acesso</p>
            <h3 id="intelligence-reset-password-title">Redefinir senha</h3>
            <p id="intelligence-reset-password-text" class="ml-modal__copy">Defina uma senha temporaria. A senha antiga nunca e exibida.</p>
          </div>
          <button class="ml-btn ml-btn--ghost" type="button" data-action="close-reset-password">Fechar</button>
        </div>
        <form id="intelligence-reset-password-form" class="ml-modal__actions">
          <label class="ml-field">
            <span>Nova senha temporaria</span>
            <input id="intelligence-reset-password-input" type="password" autocomplete="new-password" minlength="6" required />
          </label>
          <button class="ml-btn ml-btn--primary" type="submit">Salvar nova senha</button>
          <div id="intelligence-reset-password-message" class="ml-inline-message"></div>
        </form>
      </div>
    </div>

    <script type="module" src="assets/js/intelligence.js?v=20260721b"></script>
  </body>
</html>
